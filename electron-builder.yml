appId: com.copilotdesktop.app
productName: Copilot Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true

publish:
  provider: github
  owner: scammmmer2asdfa
  repo: copilotwrapper

# Each target only bundles its own platform's CLI binary. electron-builder's
# ${arch} macro resolves per-build (arm64/x64) — do NOT use string ternaries
# here, they are not valid macro syntax and silently break YAML parsing.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extraResources:
    - from: resources/copilot-cli/darwin-${arch}/copilot
      to: copilot-cli/copilot

win:
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: resources/copilot-cli/win32-x64/copilot.exe
      to: copilot-cli/copilot.exe

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  extraResources:
    - from: resources/copilot-cli/linux-x64/copilot
      to: copilot-cli/copilot

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

dmg:
  sign: false
