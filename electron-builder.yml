appId: com.copilotdesktop.app
productName: Copilot Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Native addons (better-sqlite3's .node binary) can't be dlopen'd from inside
# the asar virtual filesystem — they must live as real files on disk.
# Electron's require() patch resolves these transparently at the same
# in-package path, redirected into app.asar.unpacked.
asarUnpack:
  - '**/*.node'

publish:
  provider: github
  owner: scammmmer2asdfa
  repo: copilotwrapper

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

dmg:
  sign: false
