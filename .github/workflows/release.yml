name: Release

# Only ever runs on a version tag or manual dispatch — never on a plain push
# to main, so macOS runners (the scarce/slow ones) aren't queued for every
# commit. macOS x64 + arm64 are both built from a single macos-14 (arm64)
# runner in one electron-builder invocation (see electron-builder.yml's mac
# target arch list) instead of requesting a separate macos-13 Intel job.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: chmod +x resources/copilot-cli/linux-x64/copilot
      - run: npm run build
      - name: Package (Linux AppImage, x64)
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (Windows nsis, x64)
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-macos:
    # arm64 host: builds BOTH arm64 and x64 dmgs in one job (electron-builder
    # downloads prebuilt Electron + native module binaries per target arch;
    # no Rosetta or Intel host required). Avoids a second macos-13 job.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: chmod +x resources/copilot-cli/darwin-arm64/copilot resources/copilot-cli/darwin-x64/copilot
      - run: npm run build
      - name: Package (macOS dmg, arm64 + x64)
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml

  # A single job creates the release and uploads every platform's artifacts
  # together. Building and publishing were previously combined per-platform
  # (electron-builder --publish always in each job), but three parallel jobs
  # racing to create/update a release with the same tag produced two
  # separate draft releases with fragmented assets instead of one. Doing the
  # publish exactly once, after all builds finish, avoids that race.
  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload all platform artifacts
        run: gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

